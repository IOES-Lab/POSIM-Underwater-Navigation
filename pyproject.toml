[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posim-underwater-navigation"
version = "0.1.0.dev0"
description = "Experimental measured-sensor underwater navigation components for POSIM"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
readme = "README.md"
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/IOES-Lab/POSIM-Underwater-Navigation"

[tool.setuptools.packages.find]
where = ["src"]
